<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>StSolaVault</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="bg" class="fixed inset-0 z-0">
    <img src="IMG_3904.jpeg" alt="" id="bg-img" />
    <div class="absolute inset-0 bg-black/35"></div>
  </div>

  <div id="app" class="relative z-10 min-h-screen flex flex-col">
    <!-- PIN -->
    <div id="pin-screen" class="flex-1 flex flex-col items-center justify-center p-5">
      <div class="glass w-full max-w-[290px] p-6 text-center">
        <h1 class="text-xl font-bold tracking-tight mb-1">StSolaVault</h1>
        <p class="text-sm opacity-60 mb-6">Enter 6-digit PIN</p>
        <div id="pin-display" class="flex justify-center gap-2.5 mb-6">
          <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
          <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div id="pin-error" class="text-red-400 text-sm h-5 mb-3 opacity-0">Wrong PIN</div>
        <div class="grid grid-cols-3 gap-2.5 max-w-[220px] mx-auto">
          <button class="pin-btn" data-n="1">1</button>
          <button class="pin-btn" data-n="2">2</button>
          <button class="pin-btn" data-n="3">3</button>
          <button class="pin-btn" data-n="4">4</button>
          <button class="pin-btn" data-n="5">5</button>
          <button class="pin-btn" data-n="6">6</button>
          <button class="pin-btn" data-n="7">7</button>
          <button class="pin-btn" data-n="8">8</button>
          <button class="pin-btn" data-n="9">9</button>
          <button class="pin-btn opacity-0 pointer-events-none"></button>
          <button class="pin-btn" data-n="0">0</button>
          <button class="pin-btn" id="pin-back">⌫</button>
        </div>
        <p id="pin-hint" class="text-xs opacity-50 mt-5 hidden">First time? This sets your PIN.</p>
      </div>
    </div>

    <!-- Vault -->
    <div id="vault-screen" class="hidden flex-1 flex flex-col p-4">
      <header class="flex items-center justify-between mb-5 pt-1">
        <h1 class="text-lg font-bold">StSolaVault</h1>
        <button id="lock-btn" class="glass-btn text-sm px-3 py-1.5">Lock</button>
      </header>

      <div id="home" class="grid gap-3 flex-1 content-start">
        <button id="btn-photos" class="glass p-5 text-left flex items-center gap-4">
          <div class="w-11 h-11 rounded-2xl bg-white/10 flex items-center justify-center text-xl">📷</div>
          <div><div class="font-semibold">Photos</div><div class="text-sm opacity-50">Upload & view</div></div>
        </button>
        <button id="btn-pass" class="glass p-5 text-left flex items-center gap-4">
          <div class="w-11 h-11 rounded-2xl bg-white/10 flex items-center justify-center text-xl">🔐</div>
          <div><div class="font-semibold">Passwords</div><div class="text-sm opacity-50">Save credentials</div></div>
        </button>
      </div>

      <!-- Photos -->
      <div id="view-photos" class="hidden flex-1 flex flex-col">
        <div class="flex items-center gap-3 mb-4">
          <button class="glass-btn px-3 py-1.5 text-sm" data-back>← Back</button>
          <h2 class="font-semibold">Photos</h2>
        </div>
        <button id="btn-add-photo" class="glass mb-3 px-4 py-3 flex items-center gap-2">
          <span class="text-lg">＋</span><span class="font-medium">Add Photo</span>
        </button>
        <input type="file" id="photo-input" accept="image/*" class="hidden" multiple />
        <div id="photos-grid" class="grid grid-cols-2 gap-2.5 overflow-y-auto flex-1 pb-6"></div>
      </div>

      <!-- Passwords -->
      <div id="view-pass" class="hidden flex-1 flex flex-col">
        <div class="flex items-center gap-3 mb-4">
          <button class="glass-btn px-3 py-1.5 text-sm" data-back>← Back</button>
          <h2 class="font-semibold">Passwords</h2>
        </div>
        <button id="btn-add-pass" class="glass mb-3 px-4 py-3 flex items-center gap-2">
          <span class="text-lg">＋</span><span class="font-medium">Add Password</span>
        </button>
        <div id="pass-list" class="space-y-2.5 overflow-y-auto flex-1 pb-6"></div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-start justify-center p-4 pt-[12vh] bg-black/60">
    <div class="glass w-full max-w-sm p-5">
      <h3 id="modal-title" class="font-semibold text-lg mb-4">Add Password</h3>
      <form id="pass-form" class="space-y-3">
        <input type="text" id="f-title" placeholder="Title" class="glass-input" required />
        <input type="text" id="f-user" placeholder="Username / Email" class="glass-input" />
        <input type="text" id="f-pass" placeholder="Password" class="glass-input" required />
        <input type="text" id="f-notes" placeholder="Notes" class="glass-input" />
        <div class="flex gap-2 pt-2">
          <button type="button" id="modal-cancel" class="glass-btn flex-1 py-2.5">Cancel</button>
          <button type="submit" class="glass-btn flex-1 py-2.5 bg-white/20">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Viewer -->
  <div id="viewer" class="fixed inset-0 z-50 hidden bg-black/90 items-center justify-center p-4">
    <button id="viewer-close" class="absolute top-5 right-5 text-white text-3xl">&times;</button>
    <img id="viewer-img" class="max-w-full max-h-full object-contain rounded-xl" />
  </div>

  <script src="js/app.js"></script>
</body>
</html>
